name: DNI Status Tracker

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Consulta DNI
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          EXPEDIENTE: ${{ secrets.EXPEDIENTE }}
          DIA: ${{ secrets.DIA }}
          MES: ${{ secrets.MES }}
          ANIO: ${{ secrets.ANIO }}
        run: python bot_action.py

      - name: Commit e Push do status atualizado
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_status.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Status DNI atualizado" && git push)