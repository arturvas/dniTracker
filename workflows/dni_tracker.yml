name: DNI Status Tracker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 * * * *'

jobs:
  check-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencia
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar rastreio
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          EXPEDIENTE: ${{ secrets.EXPEDIENTE }}
          DIA: ${{ secrets.DIA }}
          MES: ${{ secrets.MES }}
          ANIO: ${{ secrets.ANIO }}
        run: python bot_action.py